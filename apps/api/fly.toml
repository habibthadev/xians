app = "xians-api"
primary_region = "iad"

[build]
  docker = "./Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  concurrency = 20
  [http_service.health_check]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  MAX_FILE_SIZE_MB = "100"
  MAX_BATCH_SIZE_MB = "500"
  MAX_FILES_PER_BATCH = "20"
  DEFAULT_TTL_HOURS = "168"
  RATE_LIMIT_INIT_PER_MIN = "10"
  RATE_LIMIT_UNLOCK_PER_MIN = "5"
  RATE_LIMIT_REPORT_PER_HOUR = "3"
  PORT = "8080"
  ALLOWED_ORIGIN = "https://xians.vercel.app"
