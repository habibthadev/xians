# fly.toml app configuration file generated for xians-api on 2026-07-11T12:17:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xians-api'
primary_region = 'jnb'

[build]

[env]
  ALLOWED_ORIGIN = 'https://xians.vercel.app'
  DEFAULT_TTL_HOURS = '168'
  MAX_BATCH_SIZE_MB = '500'
  MAX_FILES_PER_BATCH = '20'
  MAX_FILE_SIZE_MB = '100'
  PORT = '8080'
  RATE_LIMIT_INIT_PER_MIN = '10'
  RATE_LIMIT_REPORT_PER_HOUR = '3'
  RATE_LIMIT_UNLOCK_PER_MIN = '5'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
